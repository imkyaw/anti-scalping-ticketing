<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>FairTicket — Anti-Scalping Ticketing</title>
    <script>
      // Key must match THEME_STORAGE_KEY in src/theme/themeMode.ts.
      ;(function () {
        var mode = 'dark'
        try {
          var stored = localStorage.getItem('fairticket.theme')
          if (stored === 'light' || stored === 'dark') mode = stored
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) mode = 'light'
        } catch (e) {}
        document.documentElement.dataset.theme = mode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
